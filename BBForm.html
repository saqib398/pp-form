<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>BB Data Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      margin: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      height: 30px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--tg-theme-hint-color, #999999);
      border-radius: 8px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 8px;
      cursor: pointer;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }
    .checkbox-group input {
      width: auto;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>BB Data Entry</h2>
    <img src="https://www.airtel.in/content/dam/airtel/images/airtel-red.svg" class="logo" alt="Airtel Logo">
  </div>
  
  <form id="bbForm">
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>
    
    <div class="form-group">
      <label for="orderid">Order ID</label>
      <input type="text" id="orderid" name="orderid" required>
    </div>
    
    <div class="form-group">
      <label for="customername">Customer Name</label>
      <input type="text" id="customername" name="customername" required>
    </div>
    
    <div class="form-group">
      <label for="connectiontype">Connection Type</label>
      <select id="connectiontype" name="connectiontype" required>
        <option value="">Select</option>
        <option value="Fiber">Fiber</option>
        <option value="Air Fiber">Air Fiber</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="plan">Plan</label>
      <input type="text" id="plan" name="plan">
      <div class="checkbox-group">
        <input type="checkbox" id="dth" name="dth">
        <label for="dth">Includes DTH</label>
      </div>
    </div>
    
    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="">Select</option>
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="afname">AF Name</label>
      <select id="afname" name="afname" required>
        <option value="">Select</option>
        <option value="Shivam Sharma">Shivam Sharma</option>
        <option value="Bhawana Bhatt">Bhawana Bhatt</option>
        <option value="Mayank Gupta">Mayank Gupta</option>
        <option value="Monika Sharma">Monika Sharma</option>
        <option value="Sangeeta">Sangeeta</option>
        <option value="Asif Khan">Asif Khan</option>
        <option value="Nitin">Nitin</option>
        <option value="Diivya Kashyap">Diivya Kashyap</option>
        <option value="Gaurav Rajput">Gaurav Rajput</option>
        <option value="Pankaj Saxena">Pankaj Saxena</option>
        <option value="Rakesh Kumar">Rakesh Kumar</option>
        <option value="XFE">XFE</option>
        <option value="Manish BB Champ">Manish BB Champ</option>
      </select>
    </div>
    
    <button type="submit">Submit BB Data</button>
  </form>

    tg.enableClosingConfirmation();
